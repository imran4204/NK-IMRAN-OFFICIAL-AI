<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer border with neon glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Glowing central node/circle -->
  <circle cx="256" cy="256" r="170" fill="#06b6d4" opacity="0.06" filter="url(#glow)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Monogram NK -->
  <g filter="url(#glow)">
    <!-- Letter N -->
    <path d="M150 340 V172 H182 L242 276 V172 H274 V340 H242 L182 236 V340 Z" fill="url(#cyanBlueGrad)" />
    <!-- Letter K -->
    <path d="M298 172 H330 V236 L380 172 H418 L358 248 L422 340 H382 L330 262 V340 H298 Z" fill="#ffffff" />
  </g>

  <!-- AI Badge -->
  <g transform="translate(186, 380)">
    <rect width="140" height="42" rx="21" fill="#080c14" stroke="#06b6d4" stroke-width="2" />
    <text x="70" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#06b6d4" text-anchor="middle" letter-spacing="4">OFFICIAL AI</text>
  </g>

  <!-- Subtle neural dots -->
  <circle cx="150" cy="172" r="6" fill="#38bdf8" />
  <circle cx="274" cy="172" r="6" fill="#38bdf8" />
  <circle cx="418" cy="172" r="6" fill="#38bdf8" />
  <circle cx="422" cy="340" r="6" fill="#38bdf8" />
</svg>
